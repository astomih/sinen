<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinen Docs</title>

  <link rel="alternate" hreflang="ja" href="./ja/home/" />
  <link rel="alternate" hreflang="en" href="./home/" />
  <link rel="alternate" hreflang="x-default" href="./home/" />
  <script>
    const language = (navigator.language || "en").split("-")[0];
    location.replace(language === "ja" ? "./ja/home/" : "./home/");
  </script>
</head>

<body>
  <a href="./home/" hreflang="en">English</a>
  <a href="./ja/home/" hreflang="ja" lang="ja">日本語</a>
</body>

</html>
