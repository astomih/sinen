[project]
site_name = "Sinen Docs"
site_url = "https://astomih.github.io/sinen/"
repo_url = "https://github.com/astomih/sinen"
repo_name = "astomih/sinen"
nav = [
    { "English" = [
        { "Home" = "home.md" },
        { "Tutorial" = "tutorial.md" },
        { "Luau API" = "luau_api.md" },
        { "Native modules" = "native_modules.md" },
        { "C++ / Luau bindings" = "luau_bind.md" },
    ] },
    { "日本語" = [
        { "ホーム" = "ja/home.md" },
        { "チュートリアル" = "ja/tutorial.md" },
        { "Luau API" = "ja/luau_api.md" },
        { "ネイティブモジュール" = "ja/native_modules.md" },
        { "C++ / Luau バインディング" = "ja/luau_bind.md" },
    ] },
    { "Reference" = [
        { "Memory" = "memory.md" },
        { "Shader bundle format" = "shader_bundle_format.md" },
    ] },
]

[project.theme]
variant = "modern"
custom_dir = "docs_theme"
logo = "logo/logo.svg"
favicon = "icon/icon.ico"
features = ["navigation.tabs", "navigation.top", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.redirects.redirect_maps]
"ja/memory.md" = "memory.md"
"ja/shader_bundle_format.md" = "shader_bundle_format.md"

[project.extra]
alternate = [
    { name = "English", link = "/sinen/home/", lang = "en" },
    { name = "日本語", link = "/sinen/ja/home/", lang = "ja" },
]
