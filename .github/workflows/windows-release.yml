name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install vulkan-sdk -y --no-progress

          $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdkRoot) {
            throw "Vulkan SDK was not found after installation."
          }

          "VULKAN_SDK=$($sdkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkBin = Join-Path $sdkRoot.FullName "Bin"
          $sdkLib = Join-Path $sdkRoot.FullName "Lib"
          "VK_SDK_PATH=$($sdkRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_INCLUDE_DIR=$($sdkRoot.FullName)\Include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_LIBRARY=$sdkLib\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            build/windows-release/_deps
            build/windows-release/libs/slang/slang-*-windows-*
            build/windows-release/libs/slang/slang-tint-windows-x64
            build/windows-release/libs/slang/webgpu_dawn-windows-x64
          key: ${{ runner.os }}-windows-release-deps-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.gitmodules', 'libs/WebGPU-distribution/wgpu-native/wgpu-native-git-tag.txt', 'libs/slang/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-windows-release-deps-v1-

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSINEN_ENABLE_NATIVE_WEBGPU_DAWN=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/windows-release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = Join-Path $PWD "build/windows-release"
          $distDir = Join-Path $PWD "dist"
          $releaseExePath = Join-Path $distDir "sinen.exe"

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $exePath = Join-Path $buildDir "sinen.exe"
          if (-not (Test-Path $exePath)) {
            throw "Built executable was not found: $exePath"
          }

          if (Test-Path $releaseExePath) {
            Remove-Item $releaseExePath -Force
          }

          Copy-Item $exePath -Destination $releaseExePath -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinen-exe
          path: dist/sinen.exe

      - name: Upload Slang Host Generators
        uses: actions/upload-artifact@v4
        with:
          name: slang-host-generators
          path: build/windows-release/generators/Release/bin/*.exe

  build_android:
    name: Build Android
    runs-on: windows-2022
    needs:
      - build_windows
    env:
      ANDROID_CMAKE_VERSION: 4.1.1
      ANDROID_NDK_VERSION: 28.1.13356709
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SINEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SINEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SINEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: build/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_HOME
          }
          if (-not $sdkRoot) {
            throw "The Android SDK was not found on the runner."
          }

          $sdkManager = Join-Path $sdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            throw "sdkmanager was not found: $sdkManager"
          }

          & $sdkManager `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "cmake;$env:ANDROID_CMAKE_VERSION" `
            "ndk;$env:ANDROID_NDK_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the Android SDK packages."
          }

          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_ROOT=$sdkRoot\ndk\$env:ANDROID_NDK_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Slang Host Generators
        uses: actions/download-artifact@v4
        with:
          name: slang-host-generators
          path: build/android-host-generators

      - name: Restore Android Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            build/android/arm64-v8a_28_Release/_deps
            build/android/arm64-v8a_28_Release/libs/slang
          key: ${{ runner.os }}-android-release-deps-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.gitmodules', 'libs/slang/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-android-release-deps-v1-

      - name: Configure Android
        shell: cmd
        env:
          SINEN_SLANG_GENERATORS_PATH: ${{ github.workspace }}\build\android-host-generators
        run: build\generate_android.bat

      - name: Build Android Native Libraries
        shell: cmd
        run: build\build_android.bat

      - name: Configure Android Signing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            Write-Host "Android signing secrets are not configured; an unsigned release APK will be produced."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:SINEN_ANDROID_KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:SINEN_ANDROID_KEY_ALIAS) -or
              [string]::IsNullOrWhiteSpace($env:SINEN_ANDROID_KEY_PASSWORD)) {
            throw "ANDROID_KEYSTORE_BASE64 is set, but one or more Android signing secrets are missing."
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "sinen-release.keystore"
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          "SINEN_ANDROID_KEYSTORE=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location build/android
          try {
            .\gradlew.bat assembleRelease --no-daemon --stacktrace
            if ($LASTEXITCODE -ne 0) {
              throw "Gradle failed to assemble the Android release APK."
            }
          } finally {
            Pop-Location
          }

      - name: Package Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDir = Join-Path $PWD "build/android/app/build/outputs/apk/release"
          $signedApk = Join-Path $outputDir "app-release.apk"
          $unsignedApk = Join-Path $outputDir "app-release-unsigned.apk"
          $distDir = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          if (Test-Path $signedApk) {
            Copy-Item $signedApk (Join-Path $distDir "sinen-android-arm64-v8a.apk") -Force
          } elseif (Test-Path $unsignedApk) {
            Copy-Item $unsignedApk (Join-Path $distDir "sinen-android-arm64-v8a-unsigned.apk") -Force
          } else {
            throw "The Android release APK was not found in $outputDir."
          }

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinen-android-apk
          path: dist/sinen-android-*.apk

  build_emscripten:
    name: Build Emscripten
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            build/emscripten/_deps
            build/emscripten/libs
          key: ${{ runner.os }}-emscripten-release-deps-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.gitmodules', 'libs/WebGPU-distribution/emscripten/emscripten-git-tag.txt') }}
          restore-keys: |
            ${{ runner.os }}-emscripten-release-deps-v1-

      - name: Configure
        shell: bash
        run: |
          set -o pipefail

          emcmake cmake \
            -S . \
            -B build/emscripten \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXECUTABLE_SUFFIX=.html \
            -DBUILD_SHARED_LIBS=OFF \
            -DSINEN_MODULE_SHADER_COMPILER=OFF \
            -DSINEN_ENABLE_TRACY=OFF \
            -DSINEN_EMSCRIPTEN_ASYNCIFY=ON \
            -DSINEN_EMSCRIPTEN_ASSERTIONS=ON \
            -DSINEN_EMSCRIPTEN_DEBUG_RUNTIME=OFF \
            -DSINEN_EMSCRIPTEN_EXCEPTIONS=ON \
            -DSINEN_EMSCRIPTEN_PRELOAD_DIR="${GITHUB_WORKSPACE}/examples" \
            -DSINEN_EMSCRIPTEN_PRELOAD_MOUNT=/ \
            -DASSIMP_BUILD_ZLIB=ON \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DASSIMP_INSTALL=OFF \
            -DKTX_FEATURE_JS=OFF \
            -DKTX_FEATURE_TESTS=OFF \
            -DKTX_FEATURE_TOOLS=OFF \
            -DKTX_FEATURE_LOADTEST_APPS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL=OFF \
            -DENABLE_INSTALL=OFF \
            2>&1 | tee build/emscripten-configure.log

      - name: Upload Emscripten Configure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-configure-log
          path: build/emscripten-configure.log

      - name: Build
        shell: bash
        run: |
          cmake --build build/emscripten --parallel

      - name: Package WebGPU Site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/webgpu
          cp build/emscripten/sinen.html dist/webgpu/index.html
          cp build/emscripten/sinen.js dist/webgpu/
          cp build/emscripten/sinen.wasm dist/webgpu/
          cp build/emscripten/sinen.data dist/webgpu/

          (
            cd dist/webgpu
            zip -r ../sinen-webgpu.zip .
          )

      - name: Upload Emscripten Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinen-webgpu-zip
          path: dist/sinen-webgpu.zip

      - name: Upload WebGPU Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinen-webgpu-site
          path: dist/webgpu

  deploy_webgpu:
    name: Publish WebGPU Site
    runs-on: ubuntu-latest
    needs:
      - build_emscripten
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Download WebGPU Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: sinen-webgpu-site
          path: dist/webgpu

      - name: Publish WebGPU Site
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/webgpu
          destination_dir: webgpu
          keep_files: true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build_windows
      - build_android
      - build_emscripten
      - deploy_webgpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: sinen-exe
          path: release-assets

      - name: Download Android Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: sinen-android-apk
          path: release-assets

      - name: Download Zip Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sinen-*-zip
          path: release-assets
          merge-multiple: true

      - name: Create Date Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_tag="v$(TZ=Asia/Tokyo date +'%Y.%m.%d')"
          tag="$base_tag"
          suffix=1

          git fetch --tags
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            suffix=$((suffix + 1))
            tag="${base_tag}.${suffix}"
          done

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Automated release for $TAG."
