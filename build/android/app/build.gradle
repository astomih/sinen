plugins {
     id 'com.android.application'
}

android {
    namespace = "astomih.sinen.app"
    compileSdkVersion 35

    def releaseKeystore = System.getenv("SINEN_ANDROID_KEYSTORE")
    def releaseKeystorePassword = System.getenv("SINEN_ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("SINEN_ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("SINEN_ANDROID_KEY_PASSWORD")

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "0.0.5"
    }

    signingConfigs {
        if (releaseKeystore && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName("release")) {
                signingConfig signingConfigs.release
            }
        }
    }
}
